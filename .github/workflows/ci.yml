name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一个 PR 再推送时取消还在跑的上一轮；main 上的推送不取消，每个提交都要有完整结果。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$out" ]; then
            echo "gofmt -l reports unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go vet (GOOS=windows)
        run: GOOS=windows go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: release notes script
        run: bash .github/scripts/release-notes_test.sh

  # -race 只在 ubuntu 上开：它让 CPU 密集的测试慢一个数量级，而平台差异在路径与文件系统，不在数据竞争。
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            race: -race
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # 检出前关掉换行转换：golden 对语料文件的原始字节求哈希，CRLF 会让它失败。
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ${{ matrix.race }} -count=1 -timeout 30m ./...
      - name: golden
        env:
          HG_GOLDEN_REQUIRED: "1"
        run: go test -count=1 -timeout 30m -run '^TestGolden$' ./internal/check/action/
      # fuzz 的种子语料在普通测试里就会跑；随机探索只在 main 上做，PR 不等它。
      - name: fuzz (10s per target)
        if: github.event_name == 'push'
        run: |
          while read -r name pkg; do
            echo "== $name $pkg"
            go test -run '^$' -fuzz "^${name}\$" -fuzztime 10s -timeout 30m "$pkg"
          done <<'TARGETS'
          FuzzVerdictNeverLeaks ./internal/check/outbound/
          FuzzExpand ./pkg/detect/command/
          FuzzExpandPowerShell ./pkg/detect/command/
          FuzzFind ./pkg/detect/encoded/
          FuzzFind ./pkg/detect/pii/
          FuzzMaskNeverLeaksFoundValues ./pkg/detect/secrets/
          FuzzPatchActions ./pkg/harness/codex/
          FuzzEmbeddedPatches ./pkg/harness/codex/
          TARGETS

  # PR 是 squash 合并的：进 main 的说明来自 PR 的标题与描述，这里检查它们没有私有引用；
  # 分支上的每个提交只要能构建、gofmt 与 vet 通过、说明干净，测试由 test 对 head 跑。
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: check pull request title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr.txt"
          HG_PR_TEXT_FILE="$RUNNER_TEMP/pr.txt" go test -count=1 -run '^TestPullRequestMetadata$' ./internal/repocheck/
      - name: check each commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/each-commit.sh "$BASE_SHA" "$HEAD_SHA"
