schema: 1
id: credentials.high_entropy
# 关键词（token、secret、password、api key……）之后的高熵值
category: credentials
# 默认停用：只用于遮蔽（指令缓存、日志、发给后端的文本），不拦截；有足够的语料数据后再定是否默认拦截（维护者决定
# 2026-10-16）。开启：rules: {credentials.high_entropy: {enabled: true}}
enabled: false
on: [prompt, tool_output]
match:
  detector: credentials.high_entropy
examples:
  hit:
    - "the deploy token is gH7xK2mQ9pL4vN8rT1sW6yZ3"
  miss:
    - "the token is a94a8fe5ccb19ba61c4c0873d391e987982fbbd3"
    - "commit gH7xK2mQ9pL4vN8rT1sW6yZ3 fixed the build"
    - "Fix the token refresh bug in src/main/java/com/acme/OAuth2TokenService"
    - "the token is generated by generateHmacSha256TokenForUser"
