schema: 1
id: credentials.prefixed_token
# 带前缀的 token（sk-、ghp_、xoxb- 等）
category: credentials
on: [prompt, tool_output]
match:
  detector: credentials.prefixed_token
examples:
  hit:
    - "export OPENAI_API_KEY=sk-abcdefghijklmnop1234"
    - "gh auth login --with-token ghp_ABCDEFGHIJKLMNOPQRST"
  miss:
    - "echo skill-issue"
    - "the sk- prefix marks OpenAI keys"
    - "git checkout pk_feature_branch_for_payments"
    - "pip install sk-learn-preprocessing-module"
