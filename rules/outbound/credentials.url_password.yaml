schema: 1
id: credentials.url_password
# 连接串里的密码
category: credentials
on: [prompt, tool_output]
match:
  detector: credentials.url_password
examples:
  hit:
    - "DATABASE_URL=postgres://admin:s3cr3tP4ss@db.internal:5432/app"
  miss:
    - "https://example.com/path@v1.2"
    - "postgres://db.internal:5432/app"
    - "DATABASE_URL=postgres://user:password@localhost:5432/dev"
    - "amqp://guest:guest@localhost:5672/"
