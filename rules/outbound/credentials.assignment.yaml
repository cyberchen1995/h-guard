schema: 1
id: credentials.assignment
# key=value 写法的凭据（api_key、token、password 等）
category: credentials
on: [prompt, tool_output]
match:
  detector: credentials.assignment
examples:
  hit:
    - "api_key=s3cr3tValue42"
    - "PASSWORD: hunter2hunter2"
  miss:
    - "token=abc"
    - "set the password in the settings page"
    - "API_KEY=your-api-key-here"
    - "token = request.headers.get(\"X-Token\")"
    - "password = os.environ[\"DB_PASSWORD\"]"
    - "interface Props { token: string; password: string }"
    - "const user = { password: hashedPassword, token: accessToken }"
    - "PWD=/Users/cc/project"
    - "csrf_token=enabled"
