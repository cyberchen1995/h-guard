schema: 1
id: private_key.pem
# PEM 私钥块
category: private_key
on: [prompt, tool_output]
match:
  detector: private_key.pem
examples:
  hit:
    - "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
    - "-----BEGIN OPENSSH PRIVATE KEY-----\nb3BlbnNzaC1rZXktdjEAAAAABG5vbmU"
  miss:
    - "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG\n-----END PUBLIC KEY-----"
    - "paste your PRIVATE KEY into the vault"
    - "grep -r '-----BEGIN RSA PRIVATE KEY-----' ."
