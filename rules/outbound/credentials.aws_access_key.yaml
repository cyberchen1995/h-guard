schema: 1
id: credentials.aws_access_key
# AWS access key id
category: credentials
on: [prompt, tool_output]
match:
  detector: credentials.aws_access_key
examples:
  hit:
    - "aws_access_key_id = AKIAIOSFODNN7EXAMPL0"
  miss:
    - "AKIA is the prefix of AWS access keys"
    - "aws_access_key_id = AKIAIOSFODNN7EXAMPLE"
