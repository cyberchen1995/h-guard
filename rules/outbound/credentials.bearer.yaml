schema: 1
id: credentials.bearer
# HTTP 的 Bearer 凭据
category: credentials
on: [prompt, tool_output]
match:
  detector: credentials.bearer
examples:
  hit:
    - "curl -H 'Authorization: Bearer Ab3dEf6hIj9kLm2nOp5q' https://api.acme.io"
  miss:
    - "use a Bearer token in the Authorization header"
    - "Bearer authentication uses the AuthorizationHeaderProvider"
