schema: 1
id: destructive_git
enabled: true
action: ask
on: [exec]
requires_judge: true
reason:
  en: 'Git operation that discards uncommitted changes or untracked files'
  zh-CN: '丢弃未提交改动或未跟踪文件的 git 操作'
impact:
  en: 'Uncommitted changes or untracked files in this working tree would be lost; git cannot bring them back.'
  zh-CN: '这个工作区里未提交的改动或未跟踪的文件会丢失，git 无法找回。'
advice:
  en: 'Save them first: commit them, or git stash push --all (which also keeps ignored files that git clean -x removes); before git stash drop or clear, note their commit ids (git stash list --format=%H) so they can be restored. Then retry.'
  zh-CN: '先保存：提交，或 git stash push --all（连 git clean -x 会删的被忽略文件一起保存）；git stash drop 或 clear 之前先记下这些条目的提交号（git stash list --format=%H），以便找回。然后再重试。'
match:
  exec:
    # any 组沿用 Python 版正则，两种 shell 都适用（不拆分，只收紧）；PowerShell 专有的写法在 powershell 组
    any:
      - '\bgit(?:\.exe)?\b[^\n;&|]*\breset\s+(?:-\S+\s+)*--(?:hard|merge)\b'
      - '\bgit(?:\.exe)?\b[^\n;&|]*\bclean\b(?!(?:(?!\s--(?:\s|$))[^\n;&|])*(?:\s-[a-z]*n\b|\s--dry-run\b))'
      - '\bgit(?:\.exe)?\b[^\n;&|]*\brestore\b(?![^\n;&|]*--staged)'
      - '\bgit(?:\.exe)?\b[^\n;&|]*\bcheckout\s+(?:-\S+\s+)*(?:--(?:\s|$)|\.(?:\s|$)|-f\b|--force\b)'
      - '\bgit(?:\.exe)?\b[^\n;&|]*\bstash\s+(?:drop|clear)\b'
      - '\bgit(?:\.exe)?\b[^\n;&|]*\bworktree\s+remove\b[^\n;&|]*(?:-f\b|--force\b)'
    # 模型关闭时也打断的形态：丢弃整个工作区的改动或未跟踪文件，几乎不会是误报（维护者决定，2026-10-19）
    local:
      - '^git(?:\.exe)?(?:\s+(?:-[Cc]\s+(?:\"[^\"]*\"|''[^'']*''|\S+)|--(?:git-dir|work-tree|namespace|config-env|super-prefix)\s+(?:\"[^\"]*\"|''[^'']*''|\S+)|--?[\w-]+(?:=\S+)?))*\s+reset\s+(?:[^\s;&|]+\s+)*?--hard\b'
      - '^git(?:\.exe)?(?:\s+(?:-[Cc]\s+(?:\"[^\"]*\"|''[^'']*''|\S+)|--(?:git-dir|work-tree|namespace|config-env|super-prefix)\s+(?:\"[^\"]*\"|''[^'']*''|\S+)|--?[\w-]+(?:=\S+)?))*\s+clean\b(?!(?:(?!\s--(?:\s|$))[^\n;&|])*(?:\s-[a-z]*n[a-z]*(?:\s|$)|\s--dry-run\b))'
      - '^git(?:\.exe)?(?:\s+(?:-[Cc]\s+(?:\"[^\"]*\"|''[^'']*''|\S+)|--(?:git-dir|work-tree|namespace|config-env|super-prefix)\s+(?:\"[^\"]*\"|''[^'']*''|\S+)|--?[\w-]+(?:=\S+)?))*\s+checkout\s+(?:-\S+\s+)*(?:--\s+)?\.(?:\s|$)'
      - '^git(?:\.exe)?(?:\s+(?:-[Cc]\s+(?:\"[^\"]*\"|''[^'']*''|\S+)|--(?:git-dir|work-tree|namespace|config-env|super-prefix)\s+(?:\"[^\"]*\"|''[^'']*''|\S+)|--?[\w-]+(?:=\S+)?))*\s+checkout\b(?=[^\n;&|]*\s(?:-[a-z]*f[a-z]*|--force)(?:\s|$))'
      - '^git(?:\.exe)?(?:\s+(?:-[Cc]\s+(?:\"[^\"]*\"|''[^'']*''|\S+)|--(?:git-dir|work-tree|namespace|config-env|super-prefix)\s+(?:\"[^\"]*\"|''[^'']*''|\S+)|--?[\w-]+(?:=\S+)?))*\s+stash\s+clear\b'
question:
  kind: probability
  instructions:
    question: 'Would executing `call.command` run a git command that discards uncommitted changes in a git working tree or index, or that removes untracked files?'
    counts_as_yes: 'git reset --hard or --merge; git clean (any flags except -n or --dry-run); git restore <paths> without --staged; git checkout -- <path>, git checkout ., git checkout <ref> -- <path>; git stash drop or git stash clear; git worktree remove --force; git checkout -f or --force. Wrapped forms (sudo, sh -c, &&, ;, pipes, loops) still count.'
    counts_as_no: 'Anything that is not a git command: rm, mv, truncate or an editor deleting a file is judged by another question, not this one. Among git commands: git status, diff, log, show, blame; git add; git commit; git stash push/list/show; git reset without --hard (soft and mixed keep the working tree); git restore --staged (only unstages); git clean -n or --dry-run; a plain branch switch (git checkout <branch>, git switch <branch>); the git text only mentioned in a commit message, grep pattern, echo or documentation.'
  criteria:
    'true': 'A git command in the input would actually throw away uncommitted work or untracked files.'
    'false': 'No git command in the input does that — including when the command deletes files by other means, or when the destructive git text is only mentioned and never executed.'
examples:
  hit:
    - {shell: posix, command: "git reset --hard HEAD~1"}
    - {shell: posix, command: "git clean -fdx"}
    - {shell: posix, command: "git restore src/"}
    - {shell: posix, command: "git checkout -- ."}
    - {shell: posix, command: "git stash drop"}
    - {shell: posix, command: "cd repo; git reset --hard origin/main"}
  miss:
    - {shell: posix, command: "git status"}
    - {shell: posix, command: "git reset --soft HEAD~1"}
    - {shell: posix, command: "git restore --staged a.py"}
    - {shell: posix, command: "git clean -n"}
    - {shell: posix, command: "git checkout main"}
    - {shell: posix, command: "git stash"}
