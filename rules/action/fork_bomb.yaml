schema: 1
id: fork_bomb
enabled: true
action: deny
on: [exec]
locked: true
reason:
  en: 'Fork bomb'
  zh-CN: 'fork bomb'
match:
  exec:
    # 沿用 Python 版正则，M1 全部放在 any 组；M3 加入 PowerShell 检测时再按 shell 分组
    any:
      - ':\s*\(\s*\)\s*\{\s*:\s*\|\s*:\s*&\s*\}\s*;\s*:'
    strip_quotes: true
examples:
  hit:
    - {shell: posix, command: ":(){ :|:& };:"}
  miss:
    - {shell: posix, command: "echo ':(){ :|:& };:' >> docs/danger.md"}
