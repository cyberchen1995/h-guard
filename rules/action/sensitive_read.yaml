schema: 1
id: sensitive_read
enabled: true
action: ask
# 读取前按路径拦截（第 2 档默认开启，开箱就能拦截敏感文件读取）；读取后的内容由 outbound 扫描，两者互补。
# 只按路径匹配，不调模型，不看用户授权。通过 shell 读取（cat .env）只由命令规则覆盖。
on: [file_read]
reason:
  en: 'Reads a file that usually holds secrets (.env, private keys, cloud or SSH credentials)'
  zh-CN: '读取通常存放秘密的文件（.env、私钥、云服务或 SSH 凭据）'
impact:
  en: 'Its contents (keys, tokens, passwords) would enter the agent''s context and may be sent to the model provider.'
  zh-CN: '文件内容（密钥、token、密码）会进入 agent 的上下文，可能被发给模型服务商。'
advice:
  en: 'Let the agent use the value without reading the file (an environment variable), or read it yourself.'
  zh-CN: '让 agent 不读文件就能用到这个值（例如通过环境变量），或由你自己查看。'
match:
  file:
    # Python 版 outbound 设计的敏感路径（credentials* 收窄为常见的凭据文件名），加上常见的密钥目录与凭据文件
    # （维护者决定，2026-10-14）
    paths:
      - '**/.env'
      - '**/.env.*'
      - '**/*.pem'
      - '**/*.key'
      - '**/id_rsa*'
      # 常见的凭据文件名（AWS、gcloud 等）；不写 credentials* 前缀，源码与文档里同名的文件不拦（维护者决定）
      - '**/credentials'
      - '**/credentials.json'
      - '**/credentials.yml'
      - '**/credentials.yaml'
      - '**/credentials.toml'
      - '**/credentials.ini'
      - '**/credentials.xml'
      - '**/.credentials*'
      - '**/.git-credentials'
      - '~/.ssh/**'
      - '~/.aws/**'
      - '~/.gnupg/**'
      - '~/.netrc'
      - '~/.docker/config.json'
    # 示例文件、公钥与 known_hosts 不含秘密；逐个候选路径判断，指向秘密文件的同名符号链接照样命中
    exclude:
      - '**/.env.example'
      - '**/.env.sample'
      - '**/.env.template'
      - '**/*.pub'
      - '~/.ssh/known_hosts*'
examples:
  hit:
    - {action: file_read, path: ".env"}
    - {action: file_read, path: "config/.env.production"}
    - {action: file_read, path: "/srv/tls/server.pem"}
    - {action: file_read, path: "~/.ssh/id_ed25519"}
    - {action: file_read, path: "~/.aws/credentials"}
    - {action: file_read, path: "~/.netrc"}
  miss:
    - {action: file_read, path: ".env.example"}
    - {action: file_read, path: "~/.ssh/id_ed25519.pub"}
    - {action: file_read, path: "~/.ssh/known_hosts"}
    - {action: file_read, path: ".envrc"}
    - {action: file_read, path: "src/main.go"}
    - {action: file_read, path: "pkg/auth/credentials.go"}
