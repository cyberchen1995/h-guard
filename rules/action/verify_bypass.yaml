schema: 1
id: verify_bypass
enabled: true
action: ask
on: [exec]
requires_judge: true
reason:
  en: 'Bypasses git hooks, checks, or signing'
  zh-CN: '绕过 git hooks、检查或签名'
match:
  exec:
    # 沿用 Python 版正则，M1 全部放在 any 组；M3 加入 PowerShell 检测时再按 shell 分组
    any:
      - '(?:^|\s)--no-verify(?:\s|$)'
      - '\bgit(?:\.exe)?\b[^\n;&|]*\bcommit\b[^\n;&|]*\s-[a-z]*n[a-z]*(?:\s|$)'
      - '\b(?:HUSKY=0|HUSKY_SKIP_HOOKS=1|LEFTHOOK=0)\b'
      - '\bSKIP=\S+\s+[^\n;&|]*\b(?:git\s+commit|pre-commit)\b'
      - '\bcore\.hooksPath\b'
      - '\bpre-commit\s+uninstall\b'
      - '--no-gpg-sign\b'
      - '\bcommit\.gpgsign\s+false\b'
      - '\b(?:rm|chmod|mv|truncate)\b[^\n;&|]*\.git/hooks'
question:
  kind: probability
  instructions:
    question: 'Would executing `call.command` bypass verification hooks, checks, or signing that would otherwise run?'
    counts_as_yes: '--no-verify on git commit, push, merge or rebase; git commit -n (the short flag for --no-verify, not to be confused with -m); environment such as HUSKY=0, HUSKY_SKIP_HOOKS=1, LEFTHOOK=0, or SKIP=<hook> for pre-commit; git -c core.hooksPath=... or git config core.hooksPath pointing away from the real hooks; deleting or chmod -x on files under .git/hooks; pre-commit uninstall; --no-gpg-sign or git config commit.gpgsign false. Wrapped forms still count.'
    counts_as_no: 'git commit -m, -a or --amend without -n or --no-verify; git push without --no-verify; pre-commit run, pre-commit install; -n on commands where it means something else (git clean -n, git log -n 5, echo -n, head -n); the flag only mentioned in a commit message, grep pattern, echo or documentation.'
  criteria:
    'true': 'Running the command would actually skip hooks, checks, or signing.'
    'false': 'Hooks and checks still run, or the bypass text is only mentioned and never executed.'
examples:
  hit:
    - {shell: posix, command: "git commit -n -m \"wip\""}
    - {shell: posix, command: "git commit --no-verify -m x"}
    - {shell: posix, command: "HUSKY=0 git commit -m x"}
    - {shell: posix, command: "git -c core.hooksPath=/dev/null commit -m x"}
    - {shell: posix, command: "SKIP=ruff git commit -m x"}
  miss:
    - {shell: posix, command: "git commit -m \"x\""}
    - {shell: posix, command: "git commit -am 'x'"}
    - {shell: posix, command: "git log -n 5"}
    - {shell: posix, command: "echo -n hi"}
    - {shell: posix, command: "pre-commit run --all-files"}
