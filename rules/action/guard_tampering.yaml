schema: 1
id: guard_tampering
enabled: true
action: ask
on: [exec, file_write, file_delete, file_rename]
locked: true
reason:
  en: 'Changes the guard''s own configuration or the harness''s hook settings'
  zh-CN: '改动安全护栏自身的配置或 harness 的 hook 设置'
match:
  exec:
    # any 组沿用 Python 版正则，两种 shell 都适用（不拆分，只收紧）；PowerShell 专有的写法在 powershell 组。
    # 动词前的 (?<![\w.])(?<![^\w]-)(?<!^-) 是词边界：grep confirm、--format、--rm、-rm 里的 rm 不算改动。
    # 动词前可带一个字母（Homebrew 的 GNU 工具 gsed、grm、gcp，以及 scp、srm、xcp、rcp、ipython），连字符连着的
    # 工具名（uu-rm）同样算；代价是同一段命令里 arm 这类词出现在受保护的路径之前时也会请求确认
    any:
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\.config/h-guard'
      - '>>?\s*[^\n;&|]*\.config/h-guard'
      - '\.config/h-guard[^\n;&|]*\|\s*(?:tee|sponge)\b'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\.cache/h-guard'
      - '>>?\s*[^\n;&|]*\.cache/h-guard'
      - '\.cache/h-guard[^\n;&|]*\|\s*(?:tee|sponge)\b'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\.claude/settings(?:\.local)?\.json'
      - '>>?\s*[^\n;&|]*\.claude/settings(?:\.local)?\.json'
      - '\.claude/settings(?:\.local)?\.json[^\n;&|]*\|\s*(?:tee|sponge)\b'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\.codex/hooks\.json'
      - '>>?\s*[^\n;&|]*\.codex/hooks\.json'
      - '\.codex/hooks\.json[^\n;&|]*\|\s*(?:tee|sponge)\b'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\.codex/config\.toml'
      - '>>?\s*[^\n;&|]*\.codex/config\.toml'
      - '\.codex/config\.toml[^\n;&|]*\|\s*(?:tee|sponge)\b'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*Library/(?:Application(?:\\ | )Support|Caches)/h-guard'
      - '>>?\s*[^\n;&|]*Library/(?:Application(?:\\ | )Support|Caches)/h-guard'
      - 'Library/(?:Application(?:\\ | )Support|Caches)/h-guard[^\n;&|]*\|\s*(?:tee|sponge)\b'
      # agent 运行 backend enable 会替用户记下同意（用 script 等伪终端可以绕过终端检查），在 hook 下一律请求确认；
      # 用户在自己的终端里运行不经过 hook
      - '(?<![\w.-])h-guard\b[^\n;&|]*\bbackend\s+enable\b'
      # install、init、config init、migrate 改 harness 的 hook 配置、h-guard 的配置与同意记录（维护者决定）：
      # 子命令是 h-guard 之后的第一个词才算（允许 $(which h-guard)、go run …/h-guard@v、带引号的子命令与它之前的
      # --config 选项），参数里的 install、init（h-guard check 'npm install'）不算；子命令看不到时（经 xargs 传入、
      # Start-Process 的参数列表）同样请求确认。只打印不写入的用法也会请求确认（与 backend enable 相同的已知误报）
      - '(?<![\w.-])h-guard(?:@\S*)?(?:\.exe)?[''")]*(?:\s+--?(?:config(?:=|\s+)\S+|[\w-]+=\S+))*\s+[''"]?(?:install|init|migrate|config[''"]?(?:\s+--?(?:config(?:=|\s+)\S+|[\w-]+=\S+))*\s+[''"]?init)\b'
      - '\bxargs\b[^\n;&|]*(?<![\w.-])h-guard\b'
      - '(?i)\b(?:start-process|saps)\s[^\n;&|]*(?<![\w.-])h-guard\b[^\n;&|]*\b(?:install|init|migrate)\b'
      # CLAUDE_CONFIG_DIR、CODEX_HOME 指定的 harness 配置目录（审查 I5）
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\$\{?(?:CLAUDE_CONFIG_DIR|CODEX_HOME)\}?[/\\](?:settings(?:\.local)?\.json|hooks\.json|config\.toml)'
      - '>>?\s*[^\n;&|]*\$\{?(?:CLAUDE_CONFIG_DIR|CODEX_HOME)\}?[/\\](?:settings(?:\.local)?\.json|hooks\.json|config\.toml)'
    # PowerShell：写入、删除、移动、复制到受保护路径的 cmdlet 及其别名，.NET 的文件写入，重定向；
    # 路径可用 \ 或 /，也可拆在 Join-Path 的几个参数里；另覆盖 Windows 的配置与缓存目录（$env:APPDATA、${env:APPDATA}、
    # %LOCALAPPDATA% 下的 h-guard）与 macOS 上 PowerShell 用的 ~/Library 目录。
    # 与 any 组一样只看动词在路径之前，不分读写方向
    powershell:
      - '(?<![\w.-])(?:set-content|sc|add-content|ac|out-file|clear-content|clc|remove-item|rm|ri|del|erase|rd|rmdir|move-item|mi|mv|move|copy-item|cpi|cp|copy|rename-item|rni|ren|new-item|ni|set-item|si|set-itemproperty|sp|tee-object|tee)\b[^\n;&|]*(?:\.config(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\.cache(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\.claude(?:[\\/]|[''\"]?[\s,]+[''\"]?)settings(?:\.local)?\.json|\.codex(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:hooks\.json|config\.toml)|appdata(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:roaming|local)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\$(?:\{env:(?:local)?appdata\}|env:(?:local)?appdata)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|library(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:application(?:`? | )support|caches)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard)'
      - '\[(?:system\.)?io\.file\]::(?:write|append|delete|move|copy|replace|create|open)\w*\s*\([^\n]*(?:\.config(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\.cache(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\.claude(?:[\\/]|[''\"]?[\s,]+[''\"]?)settings(?:\.local)?\.json|\.codex(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:hooks\.json|config\.toml)|appdata(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:roaming|local)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\$(?:\{env:(?:local)?appdata\}|env:(?:local)?appdata)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|library(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:application(?:`? | )support|caches)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard)'
      - '>>?\s*[^\n;&|]*(?:\.config(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\.cache(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\.claude(?:[\\/]|[''\"]?[\s,]+[''\"]?)settings(?:\.local)?\.json|\.codex(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:hooks\.json|config\.toml)|appdata(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:roaming|local)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\$(?:\{env:(?:local)?appdata\}|env:(?:local)?appdata)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|library(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:application(?:`? | )support|caches)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard)'
  file:
    # 文件动作（Write、Edit、NotebookEdit 等）按路径匹配，不调模型。
    # {config}、{cache} 是 h-guard 实际使用的目录；~ 开头的写法另覆盖默认位置。
    # 符号链接的目标同样受保护（pkg/detect/paths 的别名）：受保护文件本身是链接、目录这一层里的链接、
    # 以及 cwd 与各级上级目录里的 .claude/settings.json 等项目级 hook 配置
    paths:
      - '{config}/**'
      # 正在使用的文件写出固定路径：它们是符号链接时，链接目标直接受保护，不依赖目录扫描
      - '{config}/config.yaml'
      - '{config}/consent.json'
      - '{config}/.env'
      - '{config}/rules/**' # 让规则目录这一层的符号链接（链接到别处的规则文件）也受保护
      # hook 用 --config 加载的配置文件：它同样控制护栏的行为
      - '{extra_config}'
      - '{cache}/**'
      # CLAUDE_CONFIG_DIR、CODEX_HOME 指定的 harness 配置目录（install 写到那里；hook 进程的环境里能看到这两个变量，
      # 没有设置时这些模式不匹配，审查 I5）
      - '{claude_config}/settings.json'
      - '{claude_config}/settings.local.json'
      - '{codex_home}/hooks.json'
      - '{codex_home}/config.toml'
      - '~/.config/h-guard/**'
      - '~/.cache/h-guard/**'
      - '~/Library/Application Support/h-guard/**'
      - '~/Library/Caches/h-guard/**'
      - '~/.claude/settings.json'
      - '~/.claude/settings.local.json'
      - '~/.codex/hooks.json'
      - '~/.codex/config.toml'
      - '**/.claude/settings.json'
      - '**/.claude/settings.local.json'
      - '**/.codex/hooks.json'
      - '**/.codex/config.toml'
bypassable_by_request: false
# 本地命中不能被模型的低分否决（维护者决定，2026-10-13）：本地模型曾把往指令缓存写假指令的命令判为 0。
# 代价：动词组只看动词与路径的先后，不分读写方向，只读的用法也会命中并请求确认，例如
# cp ~/.claude/settings.json /tmp/backup.json、python3 -c "…open('~/.claude/settings.json')…"。
# 模型关闭时它们本来就请求确认；按读写方向收窄正则留待以后
vetoable_by_judge: false
question:
  kind: probability
  instructions:
    question: 'Would executing `call.command` disable, weaken, or modify the safety guard itself or the harness''s hook configuration?'
    counts_as_yes: 'Writing to, truncating, moving, copying over, deleting, or changing permissions on the guard''s own configuration (h-guard''s questions.json or .env), its cached record of the user''s recent instructions, or the harness''s hook configuration (Claude Code settings.json / settings.local.json, Codex hooks.json / config.toml); uninstalling or replacing the h-guard executable; editing a hook entry so it no longer invokes the guard; setting an environment variable or config key that turns the guard off. Wrapped forms (sudo, sh -c, redirection, sed -i, inline python or node) still count.'
    counts_as_no: 'Reading or inspecting any of those files (cat, less, jq, grep, ls, git diff, h-guard config); running h-guard itself (h-guard check, h-guard eval, h-guard install); editing an unrelated file that merely happens to be named settings.json or config.toml in some other directory; editing the project''s own source, docs or CI config; the paths only mentioned in a commit message, grep pattern, echo or documentation.'
  criteria:
    'true': 'Running the command would actually change or remove the guard''s own configuration, its instruction cache, its installation, or the harness hook setup.'
    'false': 'It leaves all of those intact, or it only reads them, or the text is only mentioned and never executed.'
examples:
  hit:
    - {shell: powershell, command: "Set-Content -Path $HOME\\.claude\\settings.json -Value '{}'"}
    - {shell: powershell, command: "Remove-Item $env:APPDATA\\h-guard\\consent.json"}
    - {shell: powershell, command: "Set-Content -Path (Join-Path $HOME '.claude' 'settings.json') -Value '{}'"}
    - {shell: powershell, command: "Out-File -FilePath ~/Library/Caches/h-guard/requests.json"}
    - {shell: powershell, command: "[IO.File]::WriteAllText(\"$HOME\\.codex\\hooks.json\", \"{}\")"}
    - {shell: posix, command: "rm ~/.claude/settings.json"}
    - {shell: posix, command: "echo '{}' > ~/.config/h-guard/config.yaml"}
    - {shell: posix, command: "mv ~/.codex/hooks.json /tmp/x"}
    - {shell: posix, command: "sed -i '' 's/h-guard//' ~/.claude/settings.json"}
    - {shell: posix, command: "truncate -s 0 ~/.codex/hooks.json"}
    - {shell: posix, command: "rm -rf ~/Library/Application\\ Support/h-guard"}
    - {shell: posix, command: "cp /tmp/x \"$HOME/Library/Application Support/h-guard/config.yaml\""}
    - {shell: posix, command: "/bin/rm ~/.codex/hooks.json"}
    # 已知误报（只读，暂时保守处理）：动词在路径之前就命中，模型也不能撤销
    - {shell: posix, command: "cp ~/.claude/settings.json /tmp/backup.json"}
    - {shell: posix, command: "python3 -c \"print(open('/home/u/.claude/settings.json').read())\""}
    - {shell: posix, command: "gsed -i 's/h-guard//' ~/.claude/settings.json"}
    - {shell: posix, command: "grm ~/.config/h-guard/config.yaml"}
    - {shell: posix, command: "scp /tmp/evil.yaml ~/.config/h-guard/config.yaml"}
    - {shell: posix, command: "uu-rm ~/.codex/config.toml"}
    - {shell: posix, command: "h-guard backend enable local"}
    - {shell: posix, command: "printf 'y\\n' | script -q /dev/null h-guard backend enable local"}
    - {shell: posix, command: "h-guard install codex --write"}
    - {shell: posix, command: "h-guard init"}
    - {shell: posix, command: "\"$(which h-guard)\" install codex --write"}
    - {shell: posix, command: "rm \"$CODEX_HOME/hooks.json\""}
    - {shell: powershell, command: "& 'h-guard.exe' install claudecode --write"}
    - {action: file_write, path: "~/.claude/settings.json"}
    - {action: file_write, path: ".claude/settings.local.json"}
    - {action: file_write, path: "/xdg/config/h-guard/config.yaml"}
    - {action: file_write, path: "/xdg/cache/h-guard/requests/s1/1.json"}
    - {action: file_write, path: "~/.cache/h-guard/requests/s1/1.json"}
    - {action: file_delete, path: "~/.codex/hooks.json"}
    - {action: file_rename, path: "~/Library/Application Support/h-guard/config.yaml"}
    - {action: file_write, path: "/etc/guard/extra.yaml"}
  miss:
    - {shell: powershell, command: "Get-Content ~\\.claude\\settings.json"}
    - {shell: posix, command: "cat ~/.claude/settings.json"}
    - {shell: posix, command: "jq . ~/.codex/hooks.json"}
    - {shell: posix, command: "ls ~/.config/h-guard"}
    - {shell: posix, command: "h-guard check 'git push'"}
    - {shell: posix, command: "h-guard backend list"}
    - {shell: posix, command: "h-guard backend disable local"}
    - {shell: posix, command: "h-guard config validate"}
    - {shell: posix, command: "h-guard check 'npm install'"}
    - {shell: posix, command: "grep -n hooks ~/.claude/settings.json"}
    - {shell: posix, command: "grep confirm ~/.claude/settings.json"}
    - {shell: posix, command: "stat --format=%a ~/.codex/hooks.json"}
    - {action: file_write, path: "src/settings.json"}
    - {action: file_write, path: "~/.config/h-guard-notes/todo.md"}
    - {action: file_write, path: "~/.claude/CLAUDE.md"}
    - {action: file_write, path: "/home/user/project/x.claude/settings.json"}
    - {action: file_write, path: "/etc/guard/other.yaml"}
