schema: 1
id: guard_tampering
enabled: true
action: ask
on: [exec, file_write, file_delete, file_rename]
locked: true
reason:
  en: 'Changes the guard''s own configuration or the harness''s hook settings'
  zh-CN: '改动安全护栏自身的配置或 harness 的 hook 设置'
impact:
  en: 'Later commands could run without h-guard''s checks.'
  zh-CN: '之后的命令可能不再经过 h-guard 检查。'
advice:
  en: 'Change h-guard''s setup yourself in a terminal (h-guard install, h-guard config) rather than through the agent.'
  zh-CN: '请在自己的终端里修改 h-guard 的设置（h-guard install、h-guard config），不要经由 agent。'
match:
  exec:
    # any 组沿用 Python 版正则，两种 shell 都适用（不拆分，只收紧）；PowerShell 专有的写法在 powershell 组。
    # 动词前的 (?<![\w.])(?<![^\w]-)(?<!^-) 是词边界：grep confirm、--format、--rm、-rm 里的 rm 不算改动。
    # 动词前可带一个字母（Homebrew 的 GNU 工具 gsed、grm、gcp，以及 scp、srm、xcp、rcp、ipython），连字符连着的
    # 工具名（uu-rm）同样算；代价是同一段命令里 arm 这类词出现在受保护的路径之前时也会请求确认
    any:
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\.config/h-guard'
      - '>>?\s*[^\n;&|]*\.config/h-guard'
      - '\.config/h-guard[^\n;&|]*\|\s*(?:tee|sponge)\b'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\.cache/h-guard'
      - '>>?\s*[^\n;&|]*\.cache/h-guard'
      - '\.cache/h-guard[^\n;&|]*\|\s*(?:tee|sponge)\b'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\.claude/settings(?:\.local)?\.json'
      - '>>?\s*[^\n;&|]*\.claude/settings(?:\.local)?\.json'
      - '\.claude/settings(?:\.local)?\.json[^\n;&|]*\|\s*(?:tee|sponge)\b'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\.codex/hooks\.json'
      - '>>?\s*[^\n;&|]*\.codex/hooks\.json'
      - '\.codex/hooks\.json[^\n;&|]*\|\s*(?:tee|sponge)\b'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\.codex/config\.toml'
      - '>>?\s*[^\n;&|]*\.codex/config\.toml'
      - '\.codex/config\.toml[^\n;&|]*\|\s*(?:tee|sponge)\b'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*Library/(?:Application(?:\\ | )Support|Caches)/h-guard'
      - '>>?\s*[^\n;&|]*Library/(?:Application(?:\\ | )Support|Caches)/h-guard'
      - 'Library/(?:Application(?:\\ | )Support|Caches)/h-guard[^\n;&|]*\|\s*(?:tee|sponge)\b'
      # agent 运行 backend enable 会替用户记下同意（用 script 等伪终端可以绕过终端检查），在 hook 下一律请求确认；
      # 用户在自己的终端里运行不经过 hook
      - '(?<![\w.-])h-guard\b[^\n;&|]*\bbackend\s+enable\b'
      # allow 批准单次授权（只能由用户在自己的终端里运行）。
      # install、init、config init、migrate 改 harness 的 hook 配置、h-guard 的配置与同意记录（维护者决定）：
      # 子命令是 h-guard 之后的第一个词才算（允许 $(which h-guard)、go run …/h-guard@v、带引号的子命令与它之前的
      # --config 选项），参数里的 install、init（h-guard check 'npm install'）不算；子命令看不到时（经 xargs 传入、
      # Start-Process 的参数列表）同样请求确认。只打印不写入的用法也会请求确认（与 backend enable 相同的已知误报）
      - '(?<![\w.-])h-guard(?:@\S*)?(?:\.exe)?[''")]*(?:\s+--?(?:config(?:=|\s+)\S+|[\w-]+=\S+))*\s+[''"]?(?:install|init|migrate|allow|config[''"]?(?:\s+--?(?:config(?:=|\s+)\S+|[\w-]+=\S+))*\s+[''"]?init)\b'
      - '\bxargs\b[^\n;&|]*(?<![\w.-])h-guard\b'
      - '(?i)\b(?:start-process|saps)\s[^\n;&|]*(?<![\w.-])h-guard\b[^\n;&|]*\b(?:install|init|migrate|allow)\b'
      # CLAUDE_CONFIG_DIR、CODEX_HOME 指定的 harness 配置目录（审查 I5）
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\$\{?(?:CLAUDE_CONFIG_DIR|CODEX_HOME)\}?[/\\](?:settings(?:\.local)?\.json|hooks\.json|config\.toml)'
      - '>>?\s*[^\n;&|]*\$\{?(?:CLAUDE_CONFIG_DIR|CODEX_HOME)\}?[/\\](?:settings(?:\.local)?\.json|hooks\.json|config\.toml)'
      # 上面这些目录被设到自定义位置时，命令里直接写出的实际路径：exec 模式的占位符展开为 h-guard 看到的目录
      # （转义后的字面量，\ 与 / 都算分隔符，主目录之下的另认 ~、$HOME 写法；没有设置时那一处不匹配）
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*(?:(?:{config}|{cache}|{extra_config})(?![\w.-])|{claude_config}[/\\]+settings(?:\.local)?\.json|{codex_home}[/\\]+(?:hooks\.json|config\.toml)|{xdg_config}[/\\]+opencode[/\\]+plugins?[/\\]+h-guard\.js|{pi_agent_dir}[/\\]+(?:extensions[/\\]+h-guard(?:-omp)?\.js|settings\.json|config\.ya?ml)|{omp_config}[/\\]+(?:profiles[/\\]+[^\n;&|/\\]+[/\\]+)?agent[/\\]+(?:extensions[/\\]+h-guard-omp\.js|config\.ya?ml|settings\.json)|{dsh_home}[/\\]+(?:profiles[/\\]+[^\n;&|/\\]+[/\\]+)?cordis\.patch\.yml)'
      - '>>?\s*[^\n;&|]*(?:(?:{config}|{cache}|{extra_config})(?![\w.-])|{claude_config}[/\\]+settings(?:\.local)?\.json|{codex_home}[/\\]+(?:hooks\.json|config\.toml)|{xdg_config}[/\\]+opencode[/\\]+plugins?[/\\]+h-guard\.js|{pi_agent_dir}[/\\]+(?:extensions[/\\]+h-guard(?:-omp)?\.js|settings\.json|config\.ya?ml)|{omp_config}[/\\]+(?:profiles[/\\]+[^\n;&|/\\]+[/\\]+)?agent[/\\]+(?:extensions[/\\]+h-guard-omp\.js|config\.ya?ml|settings\.json)|{dsh_home}[/\\]+(?:profiles[/\\]+[^\n;&|/\\]+[/\\]+)?cordis\.patch\.yml)'
      - '(?:(?:{config}|{cache}|{extra_config})(?![\w.-])|{claude_config}[/\\]+settings(?:\.local)?\.json|{codex_home}[/\\]+(?:hooks\.json|config\.toml)|{xdg_config}[/\\]+opencode[/\\]+plugins?[/\\]+h-guard\.js|{pi_agent_dir}[/\\]+(?:extensions[/\\]+h-guard(?:-omp)?\.js|settings\.json|config\.ya?ml)|{omp_config}[/\\]+(?:profiles[/\\]+[^\n;&|/\\]+[/\\]+)?agent[/\\]+(?:extensions[/\\]+h-guard-omp\.js|config\.ya?ml|settings\.json)|{dsh_home}[/\\]+(?:profiles[/\\]+[^\n;&|/\\]+[/\\]+)?cordis\.patch\.yml)[^\n;&|]*\|\s*(?:tee|sponge)\b'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*(?:{xdg_config}[/\\]+opencode(?:[/\\]+plugins?)?|{pi_agent_dir}(?:[/\\]+extensions)?|{omp_config}(?:[/\\]+agent(?:[/\\]+extensions)?)?|{dsh_home})[/\\]?(?=$|[\s''"`;&|)])'
      # opencode、pi、omp 的 h-guard 扩展与能停用扩展的设置文件，DeepSeek Harness 挂载插件的补丁（含各配置档的补丁）
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*(?:\.config/opencode/plugins?/h-guard\.js|\.pi/(?:agent/)?(?:extensions/h-guard\.js|settings\.json)|\.omp/(?:(?:profiles/[^\n;&|/]+/)?agent/)?(?:extensions/h-guard-omp\.js|config\.ya?ml|settings\.json)|\.dsh/(?:profiles/[^\n;&|/]+/)?cordis\.patch\.yml)'
      - '>>?\s*[^\n;&|]*(?:\.config/opencode/plugins?/h-guard\.js|\.pi/(?:agent/)?(?:extensions/h-guard\.js|settings\.json)|\.omp/(?:(?:profiles/[^\n;&|/]+/)?agent/)?(?:extensions/h-guard-omp\.js|config\.ya?ml|settings\.json)|\.dsh/(?:profiles/[^\n;&|/]+/)?cordis\.patch\.yml)'
      - '(?:\.config/opencode/plugins?/h-guard\.js|\.pi/(?:agent/)?(?:extensions/h-guard\.js|settings\.json)|\.omp/(?:(?:profiles/[^\n;&|/]+/)?agent/)?(?:extensions/h-guard-omp\.js|config\.ya?ml|settings\.json)|\.dsh/(?:profiles/[^\n;&|/]+/)?cordis\.patch\.yml)[^\n;&|]*\|\s*(?:tee|sponge)\b'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\$\{?(?:XDG_(?:CONFIG|CACHE)_HOME\}?[/\\]h-guard(?![\w-])|XDG_CONFIG_HOME\}?[/\\]opencode[/\\]plugins?[/\\]h-guard\.js|PI_CODING_AGENT_DIR\}?[/\\](?:extensions[/\\]h-guard(?:-omp)?\.js|settings\.json|config\.ya?ml)|DSH_HOME\}?[/\\](?:profiles[/\\][^\n;&|/\\]+[/\\])?cordis\.patch\.yml|PI_CONFIG_DIR\}?[/\\](?:profiles[/\\][^\n;&|/\\]+[/\\])?agent[/\\](?:extensions[/\\]h-guard-omp\.js|config\.ya?ml|settings\.json))'
      - '>>?\s*[^\n;&|]*\$\{?(?:XDG_(?:CONFIG|CACHE)_HOME\}?[/\\]h-guard(?![\w-])|XDG_CONFIG_HOME\}?[/\\]opencode[/\\]plugins?[/\\]h-guard\.js|PI_CODING_AGENT_DIR\}?[/\\](?:extensions[/\\]h-guard(?:-omp)?\.js|settings\.json|config\.ya?ml)|DSH_HOME\}?[/\\](?:profiles[/\\][^\n;&|/\\]+[/\\])?cordis\.patch\.yml|PI_CONFIG_DIR\}?[/\\](?:profiles[/\\][^\n;&|/\\]+[/\\])?agent[/\\](?:extensions[/\\]h-guard-omp\.js|config\.ya?ml|settings\.json))'
      # 移动、删除整个扩展目录（或它的上级目录）同样让 harness 不再加载 h-guard；目录名之后必须是词的结尾，
      # 目录里别的文件（plugins/other.js）不算
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*(?:\.config/opencode(?:/plugins?)?|\.pi(?:/agent(?:/extensions)?)?|\.omp(?:/agent(?:/extensions)?)?|\.dsh)/?(?=$|[\s''"`;&|)])'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\$\{?(?:XDG_CONFIG_HOME\}?[/\\]opencode(?:[/\\]plugins?)?|(?:PI_CODING_AGENT_DIR|DSH_HOME)\}?(?:[/\\]extensions)?|PI_CONFIG_DIR\}?(?:[/\\]agent(?:[/\\]extensions)?)?)[/\\]?(?=$|[\s''"`;&|)])'
      # OpenClaw 的 openclaw.json（加载并启用 h-guard 的插件；含 --profile 的 ~/.openclaw-<名字>），OPENCLAW_CONFIG_PATH、
      # OPENCLAW_STATE_DIR 指定的位置，与整个 ~/.openclaw 目录；改名前的 ~/.clawdbot 与 clawdbot.json 同样（升级来的
      # 安装没有 ~/.openclaw 时 OpenClaw 用它们）；状态目录里同一层的 .json5 文件（$include 引入的片段）也算
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\.(?:openclaw(?:-[^\n;&|/]+)?|clawdbot)/(?:(?:openclaw|clawdbot)\.json|[^\n;&|\s''"/]*\.json5)'
      - '>>?\s*[^\n;&|]*\.(?:openclaw(?:-[^\n;&|/]+)?|clawdbot)/(?:(?:openclaw|clawdbot)\.json|[^\n;&|\s''"/]*\.json5)'
      - '\.(?:openclaw(?:-[^\n;&|/]+)?|clawdbot)/(?:(?:openclaw|clawdbot)\.json|[^\n;&|\s''"/]*\.json5)[^\n;&|]*\|\s*(?:tee|sponge)\b'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\$\{?(?:OPENCLAW_CONFIG_PATH\}?|OPENCLAW_STATE_DIR\}?[/\\](?:(?:openclaw|clawdbot)\.json|[^\n;&|\s''"/]*\.json5))'
      - '>>?\s*[^\n;&|]*\$\{?(?:OPENCLAW_CONFIG_PATH\}?|OPENCLAW_STATE_DIR\}?[/\\](?:(?:openclaw|clawdbot)\.json|[^\n;&|\s''"/]*\.json5))'
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*\.(?:openclaw(?:-[\w-]+)?|clawdbot)/?(?=$|[\s''"`;&|)])'
      # OpenClaw 实际读的配置文件与它用 $include 引入的文件（按 h-guard 解析出的位置展开，可以在任何目录）
      - '(?<![\w.])(?<![^\w]-)(?<!^-)[a-z]?(?:rm|unlink|mv|cp|install|ln|truncate|tee|chmod|chown|shred|sed\s+-i|perl\s+-[a-z]*i|python[0-9.]*\s+-c|node\s+-e|jq\b[^\n;&|]*>)\b[^\n;&|]*(?:{openclaw_config}|{openclaw_includes})(?![\w.-])'
      - '>>?\s*[^\n;&|]*(?:{openclaw_config}|{openclaw_includes})(?![\w.-])'
      - '(?:{openclaw_config}|{openclaw_includes})(?![\w.-])[^\n;&|]*\|\s*(?:tee|sponge)\b'
      # OpenClaw 的命令行改插件设置、停用或卸载 h-guard 的插件（config patch 的内容看不到，一律请求确认）
      - '(?<![\w.-])openclaw\b[^\n;&|]*\bconfig\s+(?:set|unset)\b[^\n;&|]*\bplugins\b'
      - '(?<![\w.-])openclaw\b[^\n;&|]*\bconfig\s+patch\b'
      - '(?<![\w.-])openclaw\b[^\n;&|]*\bplugins\s+(?:disable|uninstall)\b[^\n;&|]*\bh-guard\b'
      # 重置或卸载 OpenClaw 的配置与状态（openclaw reset、openclaw uninstall --state/--all、onboard、setup 与
      # gateway --dev 的 --reset）同样去掉 h-guard 的插件设置；--dry-run 的用法也请求确认
      - '(?<![\w.-])openclaw\b(?:\s+-{1,2}\w[\w-]*(?:=\S+|\s+[^\s;&|-]\S*)?)*\s+reset\b'
      - '(?<![\w.-])openclaw\b(?:\s+-{1,2}\w[\w-]*(?:=\S+|\s+[^\s;&|-]\S*)?)*\s+uninstall\b[^\n;&|]*\s--(?:state|all)\b'
      - '(?<![\w.-])openclaw\b(?:\s+-{1,2}\w[\w-]*(?:=\S+|\s+[^\s;&|-]\S*)?)*\s+(?:onboard|setup|gateway)\b[^\n;&|]*\s--reset\b'
    # PowerShell：写入、删除、移动、复制到受保护路径的 cmdlet 及其别名，.NET 的文件写入，重定向；
    # 路径可用 \ 或 /，也可拆在 Join-Path 的几个参数里；另覆盖 Windows 的配置与缓存目录（$env:APPDATA、${env:APPDATA}、
    # %LOCALAPPDATA% 下的 h-guard）与 macOS 上 PowerShell 用的 ~/Library 目录。
    # 与 any 组一样只看动词在路径之前，不分读写方向
    powershell:
      - '(?<![\w.-])(?:set-content|sc|add-content|ac|out-file|clear-content|clc|remove-item|rm|ri|del|erase|rd|rmdir|move-item|mi|mv|move|copy-item|cpi|cp|copy|rename-item|rni|ren|new-item|ni|set-item|si|set-itemproperty|sp|tee-object|tee)\b[^\n;&|]*(?:\.config(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\.cache(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\.claude(?:[\\/]|[''\"]?[\s,]+[''\"]?)settings(?:\.local)?\.json|\.codex(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:hooks\.json|config\.toml)|appdata(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:roaming|local)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\$(?:\{env:(?:local)?appdata\}|env:(?:local)?appdata)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|library(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:application(?:`? | )support|caches)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard)'
      - '\[(?:system\.)?io\.file\]::(?:write|append|delete|move|copy|replace|create|open)\w*\s*\([^\n]*(?:\.config(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\.cache(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\.claude(?:[\\/]|[''\"]?[\s,]+[''\"]?)settings(?:\.local)?\.json|\.codex(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:hooks\.json|config\.toml)|appdata(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:roaming|local)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\$(?:\{env:(?:local)?appdata\}|env:(?:local)?appdata)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|library(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:application(?:`? | )support|caches)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard)'
      - '>>?\s*[^\n;&|]*(?:\.config(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\.cache(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\.claude(?:[\\/]|[''\"]?[\s,]+[''\"]?)settings(?:\.local)?\.json|\.codex(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:hooks\.json|config\.toml)|appdata(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:roaming|local)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|\$(?:\{env:(?:local)?appdata\}|env:(?:local)?appdata)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard|library(?:[\\/]|[''\"]?[\s,]+[''\"]?)(?:application(?:`? | )support|caches)(?:[\\/]|[''\"]?[\s,]+[''\"]?)h-guard)'
      # opencode、pi、omp 的 h-guard 扩展与设置文件，DeepSeek Harness 的补丁
      - '(?<![\w.-])(?:set-content|sc|add-content|ac|out-file|clear-content|clc|remove-item|rm|ri|del|erase|rd|rmdir|move-item|mi|mv|move|copy-item|cpi|cp|copy|rename-item|rni|ren|new-item|ni|set-item|si|set-itemproperty|sp|tee-object|tee)\b[^\n;&|]*(?:\.config[\\/]opencode[\\/]plugins?[\\/]h-guard\.js|\.pi[\\/](?:agent[\\/])?(?:extensions[\\/]h-guard\.js|settings\.json)|\.omp[\\/](?:(?:profiles[\\/][^\n;&|\\/]+[\\/])?agent[\\/])?(?:extensions[\\/]h-guard-omp\.js|config\.ya?ml|settings\.json)|\.dsh[\\/](?:profiles[\\/][^\n;&|\\/]+[\\/])?cordis\.patch\.yml)'
      - '\[(?:system\.)?io\.file\]::(?:write|append|delete|move|copy|replace|create|open)\w*\s*\([^\n]*(?:\.config[\\/]opencode[\\/]plugins?[\\/]h-guard\.js|\.pi[\\/](?:agent[\\/])?(?:extensions[\\/]h-guard\.js|settings\.json)|\.omp[\\/](?:(?:profiles[\\/][^\n;&|\\/]+[\\/])?agent[\\/])?(?:extensions[\\/]h-guard-omp\.js|config\.ya?ml|settings\.json)|\.dsh[\\/](?:profiles[\\/][^\n;&|\\/]+[\\/])?cordis\.patch\.yml)'
