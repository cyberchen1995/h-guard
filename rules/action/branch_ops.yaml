schema: 1
id: branch_ops
enabled: true
action: ask
on: [exec]
requires_judge: true
reason:
  en: 'Rewrites history, force-deletes a branch, changes an upstream, or creates a tracking branch'
  zh-CN: '改写历史、强制删分支、改 upstream 或创建跟踪分支'
impact:
  en: 'Commits on the rewritten or deleted branch can disappear from the branch (and from the remote after a push).'
  zh-CN: '被改写或删除的分支上的提交可能从分支上消失（推送后远端也一样）。'
advice:
  en: 'Note the current commit first (git rev-parse HEAD) or create a backup branch (git branch backup-<name>).'
  zh-CN: '先记下当前提交（git rev-parse HEAD）或建一个备份分支（git branch backup-<name>）。'
match:
  exec:
    # any 组沿用 Python 版正则，两种 shell 都适用（不拆分，只收紧）；PowerShell 专有的写法在 powershell 组
    any:
      - '\bgit(?:\.exe)?\b[^\n;&|]*\brebase\b(?![^\n;&|]*--abort)'
      - '\bgit(?:\.exe)?\b[^\n;&|]*\bbranch\s+(?:-\S+\s+)*(?-i:-D)(?:\s|$)'
      - '\bgit(?:\.exe)?\b[^\n;&|]*\bbranch\s+(?:-\S+\s+)*(?:--delete\s+--force|--force\s+--delete)\b'
      - '\bgit(?:\.exe)?\b[^\n;&|]*\bbranch\s+(?:-\S+\s+)*(?:-u\b|--set-upstream-to\b|--unset-upstream\b)'
      - '\bgit(?:\.exe)?\b[^\n;&|]*\b(?:checkout\s+-b|switch\s+-c)\b[^\n;&|]*(?:\borigin/|--track\b)'
      - '\bgit(?:\.exe)?\b[^\n;&|]*\bpush\b[^\n;&|]*(?:\s-f\b|--force\b|--force-with-lease\b|\s-u\b|--set-upstream\b)'
      - '\bgit(?:\.exe)?\b[^\n;&|]*\b(?:filter-branch|filter-repo)\b'
      - '\b(?:python[\d.]*|py)(?:\.exe)?\b[^\n;&|]*\s-m\s*git_filter_repo\b'
      - '\bgit(?:\.exe)?\b[^\n;&|]*\breflog\s+expire\b'
      - '\bgit(?:\.exe)?\b[^\n;&|]*\bgc\b[^\n;&|]*--prune=now\b'
    # 模型关闭时也打断的形态：不带 lease 的强制推送（覆盖远端别人的提交）与整段改写历史的工具（维护者决定，2026-10-19）；
    # git filter-repo、git-filter-repo 与 python -m git_filter_repo 的 --analyze、--dry-run 只读，不打断
    local:
      - '^git(?:\.exe)?(?:\s+(?:-[Cc]\s+(?:\"[^\"]*\"|''[^'']*''|\S+)|--(?:git-dir|work-tree|namespace|config-env|super-prefix)\s+(?:\"[^\"]*\"|''[^'']*''|\S+)|--?[\w-]+(?:=\S+)?))*\s+push\b(?![^\n;&|]*(?:\s--dry-run\b|\s-[a-z]*n[a-z]*(?:\s|$)))(?=[^\n;&|]*(?:\s-[a-z]*f[a-z]*(?:\s|$)|\s--force(?![-\w])|\s--mirror\b|\s\+[\w./-]))'
      - '^git(?:\.exe)?(?:\s+(?:-[Cc]\s+(?:\"[^\"]*\"|''[^'']*''|\S+)|--(?:git-dir|work-tree|namespace|config-env|super-prefix)\s+(?:\"[^\"]*\"|''[^'']*''|\S+)|--?[\w-]+(?:=\S+)?))*\s+(?:filter-branch\b|filter-repo\b(?![^\n;&|]*\s--(?:analyze|dry-run)(?:\s|$)))'
      - '^(?:(?:(?:python[\d.]*|py)(?:\.exe)?\s+)?(?:\S*/)?git-filter-repo(?:\.py)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+(?:-[WX]\s+\S+|-[^\sm]\S*))*\s+-m\s*git_filter_repo)(?=\s|$)(?![^\n;&|]*\s--(?:analyze|dry-run)(?:\s|$))'
question:
  kind: probability
  instructions:
    question: 'Would executing `call.command` rewrite git history, force-delete a branch, change a branch''s upstream, or create a local branch that tracks a remote branch?'
    counts_as_yes: 'git rebase in any form (including -i, --onto, --continue); git branch -D or --delete --force; git branch -u, --set-upstream-to, --unset-upstream; git push -u or --set-upstream; git checkout -b <name> origin/<branch> or with --track; git switch -c <name> --track or origin/<branch>; git push --force, --force-with-lease, -f; git filter-branch, git filter-repo, git reflog expire, git gc --prune=now. Wrapped forms still count.'
    counts_as_no: 'git branch -d (safe delete, refuses unmerged branches); git branch with no arguments (list); git checkout -b <name> or git switch -c <name> with no remote tracking; git merge; git commit --amend (deliberately not counted in this rule); git rebase --abort; git fetch; the text only mentioned in a commit message, grep pattern, echo or documentation.'
  criteria:
    'true': 'Running the command would actually rewrite history, force-delete a branch, change upstream, or create a tracking branch.'
    'false': 'It does none of those, or the text is only mentioned and never executed.'
examples:
  hit:
    - {shell: posix, command: "git rebase -i HEAD~3"}
    - {shell: posix, command: "git branch -D feature"}
    - {shell: posix, command: "git branch -u origin/main"}
    - {shell: posix, command: "git checkout -b fix origin/fix"}
    - {shell: posix, command: "git switch -c x --track origin/x"}
    - {shell: posix, command: "git push --force-with-lease"}
    - {shell: posix, command: "watch python3 -m git_filter_repo --force"}
    - {shell: posix, command: "python3 -m git_filter_repo --path secrets"}
  miss:
    - {shell: posix, command: "git branch -d merged"}
    - {shell: posix, command: "git branch"}
    - {shell: posix, command: "git checkout -b feature"}
    - {shell: posix, command: "git rebase --abort"}
    - {shell: posix, command: "git merge main"}
