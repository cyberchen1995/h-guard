# h-guard messages (English, the default). Keys are listed in internal/i18n/keys.go.
action.blocked: "Blocked: {rules}."
action.dangerous: "The agent chose a dangerous operation on its own and needs your confirmation: {rules}."
action.dangerous_local: "This operation is dangerous and needs your confirmation: {rules}."
action.radius: "Blast radius {radius}/3."
action.not_requested: "The user's recent instructions do not explicitly ask for it ({p})."
action.guard_self: "This changes the safety guard itself and always needs your confirmation: {rules}."
action.guard_self_file: "This changes a protected file ({paths}); changing it would switch the safety guard off for later commands, so it always needs your confirmation: {rules}."
action.file_rule: "This file operation touches {paths}, which a path rule covers, so it needs your confirmation: {rules}."
action.glob_too_many: "The command reads files through `{pattern}`, which expands to more than {limit} files or across directories; h-guard did not check them all for secrets, so it needs your confirmation."
action.read_unreadable: "The command reads files through `{pattern}`, but h-guard cannot list `{dir}` to see which files that covers, so it did not check them for secrets and needs your confirmation."
action.judge_unavailable: "The judge is unavailable ({code}), so the matching rules ask for confirmation: {rules}."
action.evidence_truncated: "The command or the user's instructions were too long to show the judge in full, so no exemption applies."
action.regex_timeout: "A rule took too long to match and was treated as matched."
action.budget_exceeded: "The local check ran out of time."
outbound.credentials: "Contains credentials ({count} found, line {lines})."
outbound.private_key: "Contains a private key ({count} found, line {lines})."
outbound.pii: "Contains personal information ({count} found, line {lines})."
outbound.custom: "Contains {category} content ({count} found, line {lines})."
outbound.judge: "The judge model reports {category} content."
action.operation: "Operation: `{command}` in {cwd}."
action.operation_here: "Operation: `{command}`."
action.impact: "Impact: {impact}"
action.advice: "Safer way: {advice}"
action.probe: "h-guard install probe: seeing this confirmation means the hook works."
error.internal: "h-guard hit an internal error and asks for confirmation to be safe."
error.config_invalid: "The h-guard configuration is invalid ({detail}); asking for confirmation to be safe."
error.input_too_large: "The hook input is too large to inspect; asking for confirmation to be safe."
error.target_unparsed: "h-guard cannot tell which files {tool} would change; asking for confirmation to be safe."
error.tool_unknown: "h-guard does not know whether {tool} runs commands or changes files, so it needs your confirmation; a tool that only reads can be listed in harnesses.{harness}.read_only_tools."
degrade.ask_unsupported: "This harness cannot ask for confirmation, so h-guard blocked it."
degrade.prompt_not_blocked: "This harness cannot hold back a prompt, so it has already reached the model."
source.local: "rule"
source.judge: "judge"
source.both: "rule+judge"
hint.manual: "Ask the user to run it themselves."
hint.consent: "Ask the user to run `h-guard backend enable {backend}` in a terminal to consent to the judge backend, then retry; or ask the user to run it themselves."
hint.judge_unavailable: "Restore the judge backend and retry, or ask the user to run it themselves."
hint.split: "Split the command into smaller steps, or ask the user to run it themselves."
hint.narrow: "Narrow the operation, or ask the user to run it themselves."
hint.outbound: "Remove the sensitive content and try again; for a false positive, ask the user to add the value to the category's ignore list or disable the rule in the h-guard config."
hint.outbound_judge: "This is the judge model's assessment, not a local rule, so it only warns: check the content and continue if it is a false positive. To stop sending prompts and tool output to the judge, ask the user to set outbound.judge: false."
hint.request: "If the user wants this, ask them to state this exact operation and target in their next message, then retry."
hint.grant: "To run exactly this once, ask the user to run `h-guard allow {id}` in their own terminal (the approval is valid for {minutes} minutes and covers only this command in this directory), then retry it unchanged; or ask the user to run it themselves."
list.separator: "; "
