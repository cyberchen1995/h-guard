# h-guard messages (English, the default). Keys are listed in internal/i18n/keys.go.
action.blocked: "Blocked: {rules}."
action.dangerous: "The agent chose a dangerous operation on its own and needs your confirmation: {rules}."
action.radius: "Blast radius {radius}/3."
action.not_requested: "The user's recent instructions do not explicitly ask for it ({p})."
action.guard_self: "This changes the safety guard itself and always needs your confirmation: {rules}."
action.judge_unavailable: "The judge is unavailable ({code}), so the matching rules ask for confirmation: {rules}."
action.evidence_truncated: "The command or the user's instructions were too long to show the judge in full, so no exemption applies."
action.regex_timeout: "A rule took too long to match and was treated as matched."
action.budget_exceeded: "The local check ran out of time."
action.probe: "h-guard install probe: seeing this confirmation means the hook works."
error.internal: "h-guard hit an internal error and asks for confirmation to be safe."
error.config_invalid: "The h-guard configuration is invalid ({detail}); asking for confirmation to be safe."
error.input_too_large: "The hook input is too large to inspect; asking for confirmation to be safe."
degrade.ask_unsupported: "This harness cannot ask for confirmation, so h-guard blocked it."
source.local: "rule"
source.judge: "judge"
source.both: "rule+judge"
hint.manual: "Ask the user to run it themselves."
hint.consent: "Run `h-guard backend enable {backend}` to consent, then retry, or ask the user to run it themselves."
hint.judge_unavailable: "Restore the judge backend and retry, or ask the user to run it themselves."
hint.split: "Split the command into smaller steps, or ask the user to run it themselves."
hint.narrow: "Narrow the operation, or ask the user to run it themselves."
hint.request: "If the user wants this, ask them to state this exact operation and target in their next message, then retry."
list.separator: "; "
